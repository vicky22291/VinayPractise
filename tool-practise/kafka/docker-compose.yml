# Single-broker Kafka in KRaft mode (no Zookeeper). Exercises 01 to 04 and 06 to 10.
# Profile "client": a Python box with confluent-kafka for the scripts/ folder.
# Exercise 05 uses docker-compose.cluster.yml (3 brokers). Exercise 11 adds docker-compose.cdc.yml.
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_SEGMENT_BYTES: 1048576
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # --- profile: client (scripts in exercises 03, 07, 10) ---
  client:
    image: python:3.12-slim
    container_name: kafka-client
    profiles: ["client"]
    depends_on: [kafka]
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts:ro
    command: ["sh", "-c", "pip install -q confluent-kafka==2.12.0 && sleep infinity"]
