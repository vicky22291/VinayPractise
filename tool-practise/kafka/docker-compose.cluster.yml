# Three-node Kafka in KRaft mode for exercise 05 (and the "rerun on 3 brokers" steps in 04 and 06).
# Each node is broker + controller. Run on its own, not with docker-compose.yml:
#   docker compose -f docker-compose.cluster.yml up -d
x-kafka: &kafka
  image: apache/kafka:4.3.1
  environment: &env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_REPLICA_LAG_TIME_MAX_MS: 10000
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

services:
  kafka-1:
    <<: *kafka
    container_name: kafka-1
    environment: {<<: *env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092}
  kafka-2:
    <<: *kafka
    container_name: kafka-2
    environment: {<<: *env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092}
  kafka-3:
    <<: *kafka
    container_name: kafka-3
    environment: {<<: *env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092}
